<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIポートフォリオ＆投資ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .tab-inactive { color: #6b7280; }
        .suggest-item:hover { background-color: #f3f4f6; cursor: pointer; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-6">
        <!-- ヘッダー -->
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-extrabold text-gray-900"><i class="fas fa-chart-pie text-blue-500 mr-2"></i>My Portfolio</h1>
            <div class="text-sm text-gray-500 bg-white px-3 py-1 rounded-full shadow-sm">
                ID: <span id="display-user-id" class="font-mono font-bold"></span>
            </div>
        </header>

        <!-- サマリーカード群 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <!-- 総資産カード -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-gray-500 font-bold mb-1">💰 総資産額</p>
                <div class="flex items-baseline gap-2">
                    <span class="text-3xl font-extrabold text-gray-900" id="total-assets">¥0</span>
                </div>
                <div class="mt-2 text-sm font-bold" id="total-profit-container">
                    評価損益: <span id="total-profit">¥0</span>
                </div>
                <p class="text-xs text-gray-400 mt-2 text-right">USD/JPY: <span id="usdjpy-rate">--</span></p>
            </div>

            <!-- 🌟 追加：配当金モチベーションカード -->
            <div class="bg-gradient-to-br from-yellow-50 to-orange-50 p-5 rounded-xl shadow-sm border border-yellow-200">
                <p class="text-sm text-yellow-700 font-bold mb-1"><i class="fas fa-seedling mr-1"></i> 予想される不労所得（年間配当）</p>
                <div class="flex items-baseline gap-2">
                    <span class="text-3xl font-extrabold text-yellow-600" id="yearly-dividend">¥0</span>
                    <span class="text-sm text-yellow-700 font-bold">/ 年</span>
                </div>
                <div class="mt-3 p-2 bg-white/60 rounded-lg">
                    <p class="text-sm font-bold text-gray-700">月のお小遣い: 約 <span id="monthly-dividend" class="text-lg text-yellow-600">0</span> 円</p>
                    <p class="text-xs text-gray-600 mt-1 font-medium" id="dividend-level-text">コツコツ投資して不労所得を育てましょう🌱</p>
                </div>
            </div>
        </div>

        <!-- アクションボタン -->
        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="openTradeModal('JP')" class="flex-1 bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow hover:bg-blue-700 transition">
                <i class="fas fa-plus-circle mr-1"></i> 取引の追加
            </button>
            <button onclick="openFundRuleModal()" class="flex-1 bg-teal-500 text-white font-bold py-3 px-4 rounded-lg shadow hover:bg-teal-600 transition">
                <i class="fas fa-sync-alt mr-1"></i> 投信・自動積立
            </button>
        </div>

        <!-- タブナビゲーション -->
        <div class="flex border-b border-gray-200 mb-6">
            <button onclick="switchTab('portfolio')" id="tab-portfolio" class="py-2 px-4 tab-active">保有資産</button>
            <button onclick="switchTab('history')" id="tab-history" class="py-2 px-4 tab-inactive">取引履歴</button>
            <button onclick="switchTab('news')" id="tab-news" class="py-2 px-4 tab-inactive">関連ニュース</button>
        </div>

        <!-- タブコンテンツ：保有資産 -->
        <div id="content-portfolio">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <ul id="portfolio-list" class="divide-y divide-gray-100">
                    <li class="p-4 text-center text-gray-500">読み込み中...</li>
                </ul>
            </div>
        </div>

        <!-- タブコンテンツ：取引履歴 -->
        <div id="content-history" class="hidden">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <ul id="history-list" class="divide-y divide-gray-100">
                    <li class="p-4 text-center text-gray-500">履歴がありません</li>
                </ul>
            </div>
        </div>

        <!-- タブコンテンツ：ニュース -->
        <div id="content-news" class="hidden">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden p-4" id="news-container">
                <p class="text-center text-gray-500">ニュースを読み込んでいます...</p>
            </div>
        </div>
    </div>

    <!-- モーダル：取引の追加 -->
    <div id="trade-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 px-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">取引の追加</h2>
                <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-1">資産タイプ</label>
                <select id="trade-asset-type" class="w-full border rounded-lg p-2 bg-gray-50" onchange="resetSearch()">
                    <option value="JP">日本株</option>
                    <option value="US">米国株</option>
                    <option value="FUND">投資信託</option>
                </select>
            </div>

            <div class="mb-4 relative">
                <label class="block text-sm font-bold text-gray-700 mb-1"><i class="fas fa-search"></i> 銘柄検索（自動入力）</label>
                <input type="text" id="trade-search" class="w-full border rounded-lg p-2" placeholder="例: 7203 または トヨタ" autocomplete="off">
                <div id="suggest-box" class="absolute z-10 w-full bg-white border border-gray-200 shadow-lg rounded-b-lg hidden max-h-48 overflow-y-auto"></div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">ティッカー/コード</label>
                    <input type="text" id="trade-ticker" class="w-full border rounded-lg p-2 bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">銘柄名</label>
                    <input type="text" id="trade-name" class="w-full border rounded-lg p-2 bg-gray-100" readonly>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">取引種別</label>
                    <select id="trade-type" class="w-full border rounded-lg p-2">
                        <option value="BUY">買付</option>
                        <option value="SELL">売却</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">取引日</label>
                    <input type="date" id="trade-date" class="w-full border rounded-lg p-2">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">数量（株/口）</label>
                    <input type="number" step="0.01" id="trade-quantity" class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">単価/基準価額</label>
                    <input type="number" step="0.01" id="trade-price" class="w-full border rounded-lg p-2">
                </div>
            </div>

            <button onclick="submitTrade()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-700 transition">
                保存する
            </button>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        const userId = window.location.pathname.replace('/', '') || 'GUEST';
        document.getElementById('display-user-id').textContent = userId;
        document.getElementById('trade-date').valueAsDate = new Date();

        let searchTimeout = null;

        // --- 初期ロード ---
        window.onload = () => {
            loadDashboard();
            setupSearch();
        };

        // --- タブ切り替え ---
        function switchTab(tabName) {
            ['portfolio', 'history', 'news'].forEach(t => {
                document.getElementById(`content-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.replace('tab-active', 'tab-inactive');
            });
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.replace('tab-inactive', 'tab-active');

            if (tabName === 'history') loadHistory();
            if (tabName === 'news') loadNews();
        }

        // --- ダッシュボード（保有資産）読み込み ---
        async function loadDashboard() {
            try {
                const res = await fetch(`/api/${userId}/portfolio`);
                const data = await res.json();

                // 資産額の表示
                document.getElementById('total-assets').textContent = `¥${Math.floor(data.total_assets).toLocaleString()}`;
                
                const totalProfit = data.total_assets - data.total_book;
                const profitEl = document.getElementById('total-profit');
                profitEl.textContent = `${totalProfit >= 0 ? '+' : ''}¥${Math.floor(totalProfit).toLocaleString()}`;
                profitEl.className = totalProfit >= 0 ? 'text-green-600' : 'text-red-600';
                
                document.getElementById('usdjpy-rate').textContent = `${data.usdjpy_rate}円 (${data.usdjpy_time})`;

                // 🌟 配当金の計算と表示
                const yearlyDiv = data.est_dividend_jpy || 0;
                const monthlyDiv = Math.floor(yearlyDiv / 12);
                document.getElementById('yearly-dividend').textContent = `¥${Math.floor(yearlyDiv).toLocaleString()}`;
                document.getElementById('monthly-dividend').textContent = monthlyDiv.toLocaleString();

                let levelText = "コツコツ投資を続けて不労所得を育てましょう🌱";
                if (monthlyDiv >= 300000) levelText = "もはや完全な不労所得生活レベル！FIRE達成！？🌴✨";
                else if (monthlyDiv >= 100000) levelText = "家賃がまるまる払えるレベル！生活が超楽になります🏠✨";
                else if (monthlyDiv >= 30000) levelText = "毎月の光熱費と水道代が全額まかなえるレベル💡";
                else if (monthlyDiv >= 10000) levelText = "格安SIMなら家族全員のスマホ代が払えるレベル📱";
                else if (monthlyDiv >= 5000) levelText = "ちょっと豪華なランチや飲み代が毎月浮くレベル🍣";
                else if (monthlyDiv >= 1000) levelText = "毎月スタバの新作が無料で飲めるレベル☕️";
                else if (monthlyDiv > 0) levelText = "銀行の利息より圧倒的にお得！チロルチョコが買えるレベル🍫";
                document.getElementById('dividend-level-text').textContent = levelText;

                // 保有リストの描画
                const listEl = document.getElementById('portfolio-list');
                listEl.innerHTML = '';
                if (data.portfolio.length === 0) {
                    listEl.innerHTML = '<li class="p-4 text-center text-gray-500">保有資産がありません。<br>「取引の追加」から登録してください。</li>';
                    return;
                }

                data.portfolio.forEach(item => {
                    const profit = item.profit_loss_jpy;
                    const profitStr = profit >= 0 ? `+¥${Math.floor(profit).toLocaleString()}` : `-¥${Math.abs(Math.floor(profit)).toLocaleString()}`;
                    const profitClass = profit >= 0 ? 'text-green-600' : 'text-red-600';
                    const isFund = item.is_fund;
                    const priceUnit = isFund ? '円 (1万口)' : (item.currency === 'USD' ? '$' : '円');

                    listEl.innerHTML += `
                        <li class="p-4 hover:bg-gray-50 transition flex justify-between items-center">
                            <div>
                                <div class="font-bold text-gray-800">${item.name}</div>
                                <div class="text-xs text-gray-500 mt-1">
                                    <span class="bg-gray-100 px-2 py-0.5 rounded mr-1">${item.category}</span>
                                    ${item.ticker}
                                </div>
                                <div class="text-xs text-gray-500 mt-1">
                                    保有: ${item.quantity.toLocaleString()} ${isFund ? '口' : '株'} | 
                                    現在値: ${item.current_price.toLocaleString()} ${priceUnit}
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-gray-900">¥${Math.floor(item.current_value_jpy).toLocaleString()}</div>
                                <div class="text-xs font-bold mt-1 ${profitClass}">${profitStr}</div>
                                <button onclick="deleteStock('${item.ticker}')" class="text-xs text-red-400 hover:text-red-600 mt-2"><i class="fas fa-trash-alt"></i> 全て削除</button>
                            </div>
                        </li>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }

        // --- 🌟 取引履歴の読み込み（削除ボタン完全対応） ---
        async function loadHistory() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '<li class="p-4 text-center text-gray-500">読み込み中...</li>';
            
            try {
                // ALLカテゴリーで履歴を一括取得
                const res = await fetch(`/api/${userId}/transactions/ALL`);
                const trades = await res.json();

                if (trades.length === 0) {
                    listEl.innerHTML = '<li class="p-4 text-center text-gray-500">取引履歴がありません</li>';
                    return;
                }

                listEl.innerHTML = '';
                trades.forEach(t => {
                    const typeLabel = t.type.includes('BUY') ? '<span class="text-red-500 font-bold">買付</span>' : '<span class="text-blue-500 font-bold">売却</span>';
                    listEl.innerHTML += `
                        <li class="p-4 hover:bg-gray-50 flex justify-between items-center">
                            <div>
                                <div class="font-bold text-gray-800">${t.name}</div>
                                <div class="text-xs text-gray-500 mt-1">${t.trade_date} | ${typeLabel}</div>
                                <div class="text-xs text-gray-500 mt-1">数量: ${t.quantity} | 単価: ${t.price.toLocaleString()}</div>
                            </div>
                            <button onclick="deleteTransaction(${t.id})" class="bg-gray-100 hover:bg-red-100 text-gray-500 hover:text-red-600 px-3 py-1 rounded transition">
                                <i class="fas fa-trash-alt"></i> 削除
                            </button>
                        </li>
                    `;
                });
            } catch (e) {
                console.error(e);
                listEl.innerHTML = '<li class="p-4 text-center text-red-500">読み込みエラー</li>';
            }
        }

        // --- 🌟 履歴削除APIを叩く関数 ---
        async function deleteTransaction(txId) {
            if (!confirm("この取引履歴を削除しますか？\n（※残りの保有数量や平均取得単価も再計算されます）")) return;
            try {
                const res = await fetch(`/api/${userId}/transaction/${txId}`, { method: 'DELETE' });
                if (res.ok) {
                    loadHistory(); // 履歴タブをリロード
                    loadDashboard(); // 保有資産タブもリロード
                } else {
                    alert("削除に失敗しました。");
                }
            } catch (e) {
                console.error(e);
                alert("通信エラーが発生しました。");
            }
        }

        // --- 銘柄の完全削除 ---
        async function deleteStock(ticker) {
            if (!confirm(`【${ticker}】のデータをすべて削除しますか？\n（※取引履歴もすべて消去されます）`)) return;
            try {
                const res = await fetch(`/api/${userId}/delete_stock/${ticker}`, { method: 'DELETE' });
                if (res.ok) loadDashboard();
            } catch (e) {
                console.error(e);
            }
        }

        // --- ニュースの読み込み ---
        async function loadNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '<p class="text-center text-gray-500">読み込み中...</p>';
            try {
                const res = await fetch(`/api/${userId}/news`);
                const news = await res.json();
                if (news.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500">関連ニュースがありません</p>';
                    return;
                }
                container.innerHTML = '<ul class="space-y-4"></ul>';
                const ul = container.querySelector('ul');
                news.forEach(n => {
                    ul.innerHTML += `
                        <li class="border-b pb-3 last:border-0">
                            <span class="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded">${n.stock_name}</span>
                            <span class="text-xs text-gray-400 ml-2">${n.pub_time}</span>
                            <a href="${n.link}" target="_blank" class="block mt-1 text-sm font-bold text-blue-600 hover:underline">${n.title}</a>
                        </li>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<p class="text-center text-red-500">ニュースの取得に失敗しました</p>';
            }
        }

        // --- 🌟 サジェスト検索（自動入力）の実装 ---
        function setupSearch() {
            const input = document.getElementById('trade-search');
            const suggestBox = document.getElementById('suggest-box');

            input.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                const query = input.value.trim();
                const assetType = document.getElementById('trade-asset-type').value;

                if (query.length < 1) {
                    suggestBox.classList.add('hidden');
                    return;
                }

                searchTimeout = setTimeout(async () => {
                    try {
                        const res = await fetch(`/api/search_stock?q=${encodeURIComponent(query)}&asset_type=${assetType}`);
                        const results = await res.json();
                        
                        suggestBox.innerHTML = '';
                        if (results.length > 0) {
                            results.forEach(item => {
                                const div = document.createElement('div');
                                div.className = 'suggest-item p-3 border-b text-sm text-gray-800';
                                div.innerHTML = `<span class="font-bold mr-2 text-gray-500">${item.ticker}</span>${item.name}`;
                                div.onclick = () => {
                                    document.getElementById('trade-ticker').value = item.ticker;
                                    document.getElementById('trade-name').value = item.name;
                                    input.value = item.name;
                                    suggestBox.classList.add('hidden');
                                    
                                    // 投信の場合は価格を自動取得してみる
                                    if(assetType === 'FUND') fetchFundPrice(item.ticker);
                                };
                                suggestBox.appendChild(div);
                            });
                            suggestBox.classList.remove('hidden');
                        } else {
                            suggestBox.innerHTML = '<div class="p-3 text-sm text-gray-500">見つかりませんでした</div>';
                            suggestBox.classList.remove('hidden');
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }, 400); // 400ミリ秒待ってから検索
            });

            // 外側をクリックしたらサジェストを閉じる
            document.addEventListener('click', (e) => {
                if (e.target !== input && e.target !== suggestBox) {
                    suggestBox.classList.add('hidden');
                }
            });
        }

        async function fetchFundPrice(ticker) {
            document.getElementById('trade-price').placeholder = "基準価額を取得中...";
            try {
                const res = await fetch(`/api/fund_info/${ticker}`);
                const data = await res.json();
                if(data.price > 0) {
                    document.getElementById('trade-price').value = data.price;
                } else {
                    document.getElementById('trade-price').placeholder = "手入力してください";
                }
            } catch (e) {
                document.getElementById('trade-price').placeholder = "取得失敗";
            }
        }

        function resetSearch() {
            document.getElementById('trade-search').value = '';
            document.getElementById('trade-ticker').value = '';
            document.getElementById('trade-name').value = '';
            document.getElementById('trade-price').value = '';
        }

        // --- モーダル制御 ---
        function openTradeModal(type) {
            document.getElementById('trade-asset-type').value = type;
            resetSearch();
            document.getElementById('trade-modal').classList.remove('hidden');
        }
        function openFundRuleModal() {
            // 投資信託用の入力としてモーダルを開く
            openTradeModal('FUND');
        }
        function closeModals() {
            document.getElementById('trade-modal').classList.add('hidden');
        }

        // --- 取引の保存 ---
        async function submitTrade() {
            const data = {
                asset_type: document.getElementById('trade-asset-type').value,
                ticker: document.getElementById('trade-ticker').value,
                name: document.getElementById('trade-name').value,
                trade_type: document.getElementById('trade-type').value,
                trade_date: document.getElementById('trade-date').value,
                quantity: parseFloat(document.getElementById('trade-quantity').value),
                price: parseFloat(document.getElementById('trade-price').value)
            };

            if (!data.ticker || !data.quantity || !data.price) {
                alert("必須項目が入力されていません！");
                return;
            }

            try {
                const res = await fetch(`/api/${userId}/trade`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    closeModals();
                    loadDashboard();
                    if(!document.getElementById('content-history').classList.contains('hidden')) {
                        loadHistory();
                    }
                } else {
                    alert("保存に失敗しました。");
                }
            } catch (e) {
                console.error(e);
                alert("通信エラーが発生しました。");
            }
        }
    </script>
</body>
</html>
